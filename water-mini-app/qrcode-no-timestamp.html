<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>无时间戳二维码生成器</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 600px;
      margin: 0 auto;
      padding: 20px;
    }
    .container {
      background-color: #f5f5f5;
      padding: 20px;
      border-radius: 10px;
      margin-bottom: 20px;
    }
    h1 {
      text-align: center;
      color: #1890ff;
    }
    .qrcode-section {
      margin: 20px 0;
    }
    .qrcode-container {
      text-align: center;
      margin: 20px 0;
    }
    #qrcode {
      display: inline-block;
      padding: 20px;
      background-color: white;
      border-radius: 10px;
      box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
    }
    .data-section {
      background-color: white;
      padding: 15px;
      border-radius: 5px;
      margin: 10px 0;
    }
    .data-section h3 {
      margin-top: 0;
      color: #333;
    }
    pre {
      white-space: pre-wrap;
      word-wrap: break-word;
      font-family: monospace;
      background-color: #f9f9f9;
      padding: 10px;
      border-radius: 5px;
      margin: 0;
    }
    .instructions {
      background-color: #e6f7ff;
      padding: 15px;
      border-radius: 5px;
      margin: 20px 0;
    }
    .instructions h3 {
      margin-top: 0;
      color: #1890ff;
    }
    ul {
      margin: 10px 0;
      padding-left: 20px;
    }
    .button-group {
      display: flex;
      gap: 10px;
      margin: 20px 0;
      justify-content: center;
    }
    button {
      padding: 10px 20px;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      font-size: 16px;
    }
    .btn-primary {
      background-color: #1890ff;
      color: white;
    }
    .btn-secondary {
      background-color: #6c757d;
      color: white;
    }
  </style>
</head>
<body>
  <h1>饮用水领用系统 - 无时间戳二维码</h1>
  
  <div class="container">
    <h2>二维码生成器</h2>
    
    <div class="button-group">
      <button class="btn-primary" onclick="generateUserQR()">生成领用人二维码</button>
      <button class="btn-secondary" onclick="generateDeliverymanQR()">生成送水员二维码</button>
    </div>
    
    <div class="qrcode-section">
      <div class="qrcode-container">
        <div id="qrcode"></div>
      </div>
    </div>
    
    <div class="data-section">
      <h3>二维码数据</h3>
      <pre id="qrcode-data"></pre>
    </div>
    
    <div class="instructions">
      <h3>使用说明</h3>
      <ul>
        <li>点击上方按钮生成对应角色的二维码</li>
        <li>使用微信扫描生成的二维码</li>
        <li>小程序会自动识别角色并登录</li>
        <li>进入相应的操作页面完成业务操作</li>
      </ul>
    </div>
  </div>
  
  <script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.1/build/qrcode.min.js"></script>
  <script>
    // 生成领用人二维码
    function generateUserQR() {
      // 生成不包含timestamp字段的领用人二维码数据
      const qrData = {
        role: "user",
        warehouseId: "1",
        signature: "test-signature-user"
      };
      
      // 转换为JSON字符串
      const qrDataString = JSON.stringify(qrData);
      
      // 显示二维码数据
      document.getElementById('qrcode-data').textContent = qrDataString;
      
      // 生成二维码
      QRCode.toCanvas(document.getElementById('qrcode'), qrDataString, {
        width: 256,
        margin: 1,
        color: {
          dark: '#000000',
          light: '#FFFFFF'
        }
      }, function (error) {
        if (error) console.error(error);
        console.log('User QR code generated successfully');
      });
    }
    
    // 生成送水员二维码
    function generateDeliverymanQR() {
      // 生成不包含timestamp字段的送水员二维码数据
      const qrData = {
        role: "deliveryman",
        warehouseId: "1",
        signature: "test-signature-deliveryman"
      };
      
      // 转换为JSON字符串
      const qrDataString = JSON.stringify(qrData);
      
      // 显示二维码数据
      document.getElementById('qrcode-data').textContent = qrDataString;
      
      // 生成二维码
      QRCode.toCanvas(document.getElementById('qrcode'), qrDataString, {
        width: 256,
        margin: 1,
        color: {
          dark: '#000000',
          light: '#FFFFFF'
        }
      }, function (error) {
        if (error) console.error(error);
        console.log('Deliveryman QR code generated successfully');
      });
    }
    
    // 默认生成领用人二维码
    generateUserQR();
  </script>
</body>
</html>
