<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>二维码生成器</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 600px;
      margin: 0 auto;
      padding: 20px;
    }
    .container {
      background-color: #f5f5f5;
      padding: 20px;
      border-radius: 10px;
      margin-bottom: 20px;
    }
    h1 {
      text-align: center;
      color: #1890ff;
    }
    .qrcode-section {
      margin: 20px 0;
    }
    .qrcode-container {
      text-align: center;
      margin: 20px 0;
    }
    #qrcode {
      display: inline-block;
      padding: 20px;
      background-color: white;
      border-radius: 10px;
      box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
    }
    .data-section {
      background-color: white;
      padding: 15px;
      border-radius: 5px;
      margin: 10px 0;
    }
    .data-section h3 {
      margin-top: 0;
      color: #333;
    }
    pre {
      white-space: pre-wrap;
      word-wrap: break-word;
      font-family: monospace;
      background-color: #f9f9f9;
      padding: 10px;
      border-radius: 5px;
      margin: 0;
    }
    .instructions {
      background-color: #e6f7ff;
      padding: 15px;
      border-radius: 5px;
      margin: 20px 0;
    }
    .instructions h3 {
      margin-top: 0;
      color: #1890ff;
    }
    ul {
      margin: 10px 0;
      padding-left: 20px;
    }
  </style>
</head>
<body>
  <h1>饮用水领用系统 - 二维码生成器</h1>
  
  <div class="container">
    <h2>送水员二维码</h2>
    
    <div class="qrcode-section">
      <div class="qrcode-container">
        <div id="qrcode"></div>
      </div>
    </div>
    
    <div class="data-section">
      <h3>二维码数据</h3>
      <pre id="qrcode-data">{"role":"deliveryman","warehouseId":"1","timestamp":"1771742640903","signature":"test-signature-deliveryman"}</pre>
    </div>
    
    <div class="instructions">
      <h3>使用说明</h3>
      <ul>
        <li>使用微信扫描上方二维码</li>
        <li>小程序会自动识别为送水员角色</li>
        <li>进入送水操作页面后，输入送水数量和空桶领取数量</li>
        <li>点击提交按钮完成送水记录</li>
      </ul>
    </div>
  </div>
  
  <script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.1/build/qrcode.min.js"></script>
  <script>
    // 送水员二维码数据
    const qrData = '{"role":"deliveryman","warehouseId":"1","timestamp":"1771742640903","signature":"test-signature-deliveryman"}';
    
    // 生成二维码
    QRCode.toCanvas(document.getElementById('qrcode'), qrData, {
      width: 256,
      margin: 1,
      color: {
        dark: '#000000',
        light: '#FFFFFF'
      }
    }, function (error) {
      if (error) console.error(error);
      console.log('QR code generated successfully');
    });
  </script>
</body>
</html>
